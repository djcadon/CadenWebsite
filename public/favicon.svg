<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>Caden in Orbit</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f1bd78" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#c77bca" stop-opacity=".45"/>
      <stop offset="1" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d59f"/>
      <stop offset=".3" stop-color="#f1bd78"/>
      <stop offset=".65" stop-color="#bd78c7"/>
      <stop offset="1" stop-color="#6b4ba6"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="29" fill="#101010"/>
  <circle cx="32" cy="32" r="27" fill="url(#glow)" opacity=".55"/>

  <g transform="rotate(-45 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="8.5" fill="url(#disk)" opacity=".5" filter="url(#blur)"/>
    <ellipse cx="32" cy="32" rx="24" ry="6" fill="none" stroke="url(#disk)" stroke-width="4"/>
    <ellipse cx="32" cy="32" rx="18" ry="3.8" fill="none" stroke="#f7d7a0" stroke-width="1.5" opacity=".9"/>
  </g>

  <circle cx="32" cy="32" r="11.5" fill="#020204"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#2b2038" stroke-width="1.5"/>
</svg>
